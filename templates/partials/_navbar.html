{% with url_name=request.resolver_match.url_name %}
<header class="navbar navbar-expand-lg d-print-none">
  <div class="container-xl">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu"
            aria-controls="navbar-menu" aria-expanded="false" aria-label="Открыть меню">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-brand navbar-brand-autodark pe-0 pe-md-3">
      <a href="{% url 'biases:dashboard' %}" class="d-flex align-items-center gap-2 text-reset text-decoration-none">
        <span>Ловушки мышления</span>
      </a>
    </div>

    <div class="navbar-nav flex-row order-lg-last align-items-center gap-3">
      <div class="nav-item">
        <button type="button" class="nav-link px-0" id="theme-toggle" title="Сменить тему" aria-label="Сменить тему">
          <i class="ti ti-moon fs-2 hide-theme-dark"></i>
          <i class="ti ti-sun fs-2 hide-theme-light"></i>
        </button>
      </div>
      <div class="nav-item d-none d-md-flex">
        <button type="button" class="btn btn-primary" title="Поймала себя"
                data-bs-toggle="modal" data-bs-target="#catch-modal">
          <i class="ti ti-plus me-1"></i>Поймала себя
        </button>
      </div>
    </div>

    <div class="collapse navbar-collapse" id="navbar-menu">
      <ul class="navbar-nav">
        <li class="nav-item{% if url_name == 'dashboard' %} active{% endif %}">
          <a class="nav-link" href="{% url 'biases:dashboard' %}">
            <span class="nav-link-icon"><i class="ti ti-brain"></i></span>
            <span class="nav-link-title">Мой мозг</span>
          </a>
        </li>
        <li class="nav-item{% if url_name == 'bias_list' or url_name == 'bias_detail' %} active{% endif %}">
          <a class="nav-link" href="{% url 'biases:bias_list' %}">
            <span class="nav-link-icon"><i class="ti ti-books"></i></span>
            <span class="nav-link-title">Каталог</span>
          </a>
        </li>
        <li class="nav-item{% if url_name == 'quiz' %} active{% endif %}">
          <a class="nav-link" href="{% url 'biases:quiz' %}">
            <span class="nav-link-icon"><i class="ti ti-target-arrow"></i></span>
            <span class="nav-link-title">Тренажёр</span>
          </a>
        </li>
        <li class="nav-item{% if url_name == 'manage' %} active{% endif %}">
          <a class="nav-link" href="{% url 'biases:manage' %}">
            <span class="nav-link-icon"><i class="ti ti-database"></i></span>
            <span class="nav-link-title">Менеджер данных</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>
{% endwith %}
